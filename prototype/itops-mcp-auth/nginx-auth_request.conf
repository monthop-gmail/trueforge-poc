# Shared settings for the auth_request subrequests. The body is dropped because
# the verifier only ever reads the Authorization header, and sending it would
# copy every MCP payload into the auth service.
proxy_pass_request_body off;
proxy_set_header Content-Length "";
proxy_set_header X-Original-URI $request_uri;
proxy_http_version 1.1;
proxy_set_header Connection "";
